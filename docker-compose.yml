services:
  proxyp:
    build: .
    container_name: proxyp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      - KVSTORE_URL=http://kvstore:5000
      - ADMIN_USERNAMES=downes
    volumes:
      - ./data:/app/data
    networks:
      - web

networks:
  web:
    external: true
